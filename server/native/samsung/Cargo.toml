[package]
name = "windfull-samsung-ocf"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ciborium = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
