name: windfull_server
description: "Windfull Windows host."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  basic_utils: ^5.8.2
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  screen_retriever: ^0.2.2
  tray_manager: ^0.5.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/windfull_tray.ico
